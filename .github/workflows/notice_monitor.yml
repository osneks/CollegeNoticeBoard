name: Check College Notices & Send Push Alerts

on:
  schedule:
    # Run every 5 minutes (standard cron syntax)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

concurrency:
  group: notice-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-notices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Notice Scraper
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || secrets.NTFY_TOPIC || 'ajcbose_circulars_sec_9f7a2d81e' }}
        run: |
          python scraper/check_notices.py

      - name: Commit and Push Updated Seen State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_notices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen notices [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to seen_notices.json"
          fi
